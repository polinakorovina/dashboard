name: Sync Telegram subscribers

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync-subscribers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync subscribers
        env:
          YANDEX_TOKEN: ${{ secrets.YANDEX_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_START_CODE: ${{ secrets.TELEGRAM_START_CODE }}
          TELEGRAM_STATE_PATH: /bot_state/subscribers_state.json
        run: python sync_subscribers.py
